name: Package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and validate package distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Check built files and bundled assets
        run: python packaging/scripts/check_distributions.py dist

      - name: Install wheel and check CLI startup
        run: |
          python -m pip install dist/*.whl
          terrascope --version
          terrascope --help
          terrascope --lang pt_BR --help
          python -c "import curses, zoneinfo; assert zoneinfo.available_timezones(), 'no IANA time zones'"

  tests:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the project with its test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q
