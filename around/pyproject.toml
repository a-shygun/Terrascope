[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "around"
version = "0.1.0"
description = "A braille-rendered terminal world map with live flight tracking, built on curses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amir Shygun", email = "ryan.shygun@gmail.com" }]
keywords = ["curses", "terminal", "tui", "map", "ascii-art", "braille", "flight-tracking", "opensky"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Terminals",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "windows-curses>=2.3; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/a-shygun/around"
Repository = "https://github.com/a-shygun/around"
Issues = "https://github.com/a-shygun/around/issues"

[project.scripts]
around = "around.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["src/around"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]
